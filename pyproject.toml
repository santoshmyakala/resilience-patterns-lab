[project]
name = "resilience-patterns-lab"
version = "0.1.0"
description = "Timeouts, retries with budgets, circuit breakers, load shedding and exactly-once effects over at-least-once queues, with tests that prove them"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "psycopg[binary]>=3.2,<3.3",
  "psycopg-pool>=3.2,<3.3",
  "boto3>=1.35",
  "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["lab"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "BLE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs Postgres (and SQS/ElasticMQ when SQS_ENDPOINT is set)"]
