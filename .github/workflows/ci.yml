name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: lab, POSTGRES_DB: lab }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 20
      sqs:
        image: softwaremill/elasticmq-native:1.6.15 # SQS-compatible broker: real visibility timeouts and DLQ redrive
        ports: ["9324:9324"]
    env:
      DATABASE_URL: postgresql://postgres:lab@localhost:5432/lab
      SQS_ENDPOINT: http://localhost:9324
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - name: Wait for ElasticMQ
        run: for _ in $(seq 1 30); do curl -fsS "$SQS_ENDPOINT/?Action=ListQueues" >/dev/null && break; sleep 1; done
      - name: Unit + integration tests (Postgres, and both the in-memory queue and ElasticMQ)
        run: pytest -v -p no:warnings

  # Build, scan, SBOM, smoke-test, sign: delegated to the central DevSecOps pipeline.
  secure-delivery:
    needs: test
    uses: santoshmyakala/devsecops-gitops-pipeline/.github/workflows/secure-container.yml@main
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write
    with:
      image-name: resilience-patterns-lab
      smoke-command: ./scripts/smoke-test.sh
      push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks (checksum-verified)
        run: |
          v=8.30.1; base=https://github.com/gitleaks/gitleaks/releases/download/v$v
          curl -sSLO "$base/gitleaks_${v}_linux_x64.tar.gz"; curl -sSLO "$base/gitleaks_${v}_checksums.txt"
          sha256sum --ignore-missing -c "gitleaks_${v}_checksums.txt"
          tar xzf "gitleaks_${v}_linux_x64.tar.gz" gitleaks
          ./gitleaks git --redact --exit-code 1 .
