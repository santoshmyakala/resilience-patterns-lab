# Weekly chaos game day against the full stack (API, worker, Postgres, ElasticMQ, fault-injectable
# dependency). Every expectation is asserted; results land in the run summary and as an artifact.
name: game-day

on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["lab/**", "scripts/game_day.py", "docker-compose.yml", "Dockerfile", ".github/workflows/game-day.yml"]

permissions:
  contents: read

concurrency:
  group: game-day
  cancel-in-progress: true

jobs:
  game-day:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start the stack
        run: |
          docker compose up -d --build
          for _ in $(seq 1 60); do curl -fsS localhost:8080/healthz/ready >/dev/null 2>&1 && break; sleep 2; done
          curl -fsS localhost:8080/healthz/ready
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install "httpx>=0.27" "psycopg[binary]>=3.2,<3.3"
      - name: Run the experiments
        run: >
          python scripts/game_day.py --compose
          --db postgresql://postgres:lab@localhost:5432/lab
          --summary "$GITHUB_STEP_SUMMARY" --json game-day.json
      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: game-day-results
          path: game-day.json
          if-no-files-found: ignore
      - if: always()
        run: docker compose down -v
